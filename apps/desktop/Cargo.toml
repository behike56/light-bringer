[package]
name = "light-bringer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = "=0.10.0"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
# ZipIterable is available through zip's unstable API.
zip = { version = "=9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
