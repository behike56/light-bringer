[package]
name = "light-bringer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = "=0.10.0"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
