name: Desktop Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_ASSET: light-bringer-macos-arm64.zip

jobs:
  build:
    name: Build for macOS (Apple Silicon)
    if: github.event.created
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Run tests
        run: cargo +stable test --locked

      - name: Build release binary
        run: cargo +stable build --release --locked

      - name: Package release binary
        run: zip -j "$RUNNER_TEMP/$RELEASE_ASSET" target/release/light-bringer

      - name: Upload release archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-macos-arm64
          path: ${{ runner.temp }}/${{ env.RELEASE_ASSET }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create the release and upload its asset.

    steps:
      - name: Download release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-macos-arm64
          path: ${{ runner.temp }}/release

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/$RELEASE_ASSET" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
